[tool.vercel]
entrypoint = "api.index:app"

[project]
name = "localstudy"
version = "1.0.0"
description = "Offline-first lecture processing toolkit and online Web Studio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "yt-dlp>=2024.0.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "imageio-ffmpeg>=0.5.0",
]
